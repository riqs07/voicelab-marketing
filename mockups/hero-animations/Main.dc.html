<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your voice, drawn live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5B3E}a:hover{color:#1F4029}
</style>
</helmet>
<div style="width: 1880px; height: 900px; box-sizing: border-box; padding: 44px 48px; background: #EFE8DC; color: #1E2620; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600">Your voice, drawn live</h1>
<p style="margin: 0; font-size: 18px; color: #4A554D">One real recording. Every movement comes from its measured pitch and word timings, so what you see is what you hear.</p>
</div>

<div style="display: flex; gap: 28px">

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="Words appearing at the height of the voice while a green line draws through them" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<line x1="16" y1="310" x2="308" y2="310" stroke="#B9C4BB" stroke-width="2" stroke-dasharray="8 6"></line>
<path d="M16 310 C 40 310, 58 302, 80 296 S 130 280, 168 284" stroke="#2E5B3E" stroke-width="6" fill="none" stroke-linecap="round"></path>
<circle cx="168" cy="284" r="7" fill="#1E2620"></circle>
<text x="20" y="292" font-size="22" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">Then</text>
<text x="74" y="280" font-size="22" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">the</text>
<text x="112" y="266" font-size="22" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif" opacity="0.55">gorilla</text>
<g fill="#2E5B3E">
<rect x="24" y="462" width="4" height="16" rx="2"></rect><rect x="32" y="456" width="4" height="28" rx="2"></rect><rect x="40" y="460" width="4" height="20" rx="2"></rect><rect x="48" y="452" width="4" height="36" rx="2"></rect><rect x="56" y="458" width="4" height="24" rx="2"></rect><rect x="64" y="464" width="4" height="12" rx="2"></rect><rect x="72" y="454" width="4" height="32" rx="2"></rect><rect x="80" y="450" width="4" height="40" rx="2"></rect><rect x="88" y="458" width="4" height="24" rx="2"></rect><rect x="96" y="462" width="4" height="16" rx="2"></rect><rect x="104" y="456" width="4" height="28" rx="2"></rect><rect x="112" y="452" width="4" height="36" rx="2"></rect><rect x="120" y="448" width="4" height="44" rx="2"></rect><rect x="128" y="454" width="4" height="32" rx="2"></rect><rect x="136" y="460" width="4" height="20" rx="2"></rect><rect x="144" y="456" width="4" height="28" rx="2"></rect><rect x="152" y="462" width="4" height="16" rx="2"></rect><rect x="160" y="458" width="4" height="24" rx="2"></rect>
</g>
<g fill="#C9D0CA">
<rect x="168" y="454" width="4" height="32" rx="2"></rect><rect x="176" y="460" width="4" height="20" rx="2"></rect><rect x="184" y="452" width="4" height="36" rx="2"></rect><rect x="192" y="458" width="4" height="24" rx="2"></rect><rect x="200" y="464" width="4" height="12" rx="2"></rect><rect x="208" y="456" width="4" height="28" rx="2"></rect><rect x="216" y="452" width="4" height="36" rx="2"></rect><rect x="224" y="460" width="4" height="20" rx="2"></rect><rect x="232" y="456" width="4" height="28" rx="2"></rect><rect x="240" y="450" width="4" height="40" rx="2"></rect><rect x="248" y="446" width="4" height="48" rx="2"></rect><rect x="256" y="452" width="4" height="36" rx="2"></rect><rect x="264" y="460" width="4" height="20" rx="2"></rect><rect x="272" y="466" width="4" height="8" rx="2"></rect><rect x="280" y="468" width="4" height="4" rx="2"></rect><rect x="288" y="468" width="4" height="4" rx="2"></rect><rect x="296" y="468" width="4" height="4" rx="2"></rect>
</g>
<line x1="166" y1="438" x2="166" y2="502" stroke="#1E2620" stroke-width="2"></line>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">0 to 3 s</b><span style="font-size: 16px; line-height: 1.4">Each word appears as it's said, at the height of the voice. The line draws in sync with the real recording.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="Close-up: the line flicks up on me, an orange ring and the label Rose" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<line x1="0" y1="380" x2="324" y2="380" stroke="#B9C4BB" stroke-width="3" stroke-dasharray="11 8"></line>
<path d="M-10 384 C 50 384, 110 378, 160 370 S 240 280, 286 190" stroke="#2E5B3E" stroke-width="9" fill="none" stroke-linecap="round"></path>
<text x="8" y="358" font-size="32" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">stared</text>
<text x="132" y="346" font-size="32" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">at</text>
<rect x="196" y="194" width="74" height="44" rx="12" fill="#FCE3CF"></rect>
<text x="204" y="226" font-size="32" font-weight="700" fill="#7A3A10" font-family="Atkinson Hyperlegible Next, sans-serif">me?</text>
<circle cx="286" cy="190" r="22" fill="none" stroke="#C26A2C" stroke-width="5"></circle>
<circle cx="286" cy="190" r="36" fill="none" stroke="#C26A2C" stroke-width="2" opacity="0.35"></circle>
<path d="M190 120 L208 102 M196 102 L208 102 L208 114" stroke="#C26A2C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="218" y="118" font-size="30" font-weight="700" fill="#C26A2C" font-family="Atkinson Hyperlegible Next, sans-serif">Rose</text>
<text x="24" y="520" font-size="14" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">camera pushed in to 1.6×</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">3 to 5 s</b><span style="font-size: 16px; line-height: 1.4">On “me?” the line flicks up. The camera pushes in, a ring pops and “Rose” lands.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="The first line in grey dashes, the second line in green falling at the end, label Fell" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<text x="20" y="150" font-size="15" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">Same phrase · second try</text>
<text x="20" y="190" font-size="30" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">Tell it again.</text>
<line x1="16" y1="300" x2="308" y2="300" stroke="#B9C4BB" stroke-width="2" stroke-dasharray="8 6"></line>
<path d="M16 300 C 60 296, 100 284, 140 290 S 230 302, 260 282 S 298 232, 310 224" stroke="#8C978F" stroke-width="4" fill="none" stroke-dasharray="10 7" stroke-linecap="round"></path>
<path d="M16 296 C 60 286, 100 278, 140 284 S 230 300, 260 320 S 298 354, 310 360" stroke="#2E5B3E" stroke-width="6" fill="none" stroke-linecap="round"></path>
<path d="M226 240 L242 256 M242 244 L242 256 L230 256" stroke="#2E5B3E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="250" y="256" font-size="24" font-weight="700" fill="#2E5B3E" font-family="Atkinson Hyperlegible Next, sans-serif">Fell</text>
<g font-size="15" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">
<text x="16" y="406">Then</text><text x="58" y="406">the</text><text x="90" y="406">gorilla</text><text x="146" y="406">just</text><text x="182" y="406">stared</text><text x="236" y="406">at</text><text x="262" y="406" font-weight="700">me.</text>
</g>
<line x1="20" y1="446" x2="48" y2="446" stroke="#8C978F" stroke-width="3" stroke-dasharray="6 4"></line>
<text x="56" y="451" font-size="14" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">First try</text>
<line x1="132" y1="446" x2="160" y2="446" stroke="#2E5B3E" stroke-width="4"></line>
<text x="168" y="451" font-size="14" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">This try</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">5 to 9 s</b><span style="font-size: 16px; line-height: 1.4">The second take plays. The old line turns grey and dashed; the new one draws over it and falls.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="The pitch card shrinking into a phone showing the app" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<rect x="14" y="150" width="296" height="230" rx="26" fill="none" stroke="#2E5B3E" stroke-width="2" opacity="0.12"></rect>
<rect x="46" y="138" width="232" height="300" rx="30" fill="none" stroke="#2E5B3E" stroke-width="2" opacity="0.22"></rect>
<rect x="82" y="112" width="160" height="340" rx="28" fill="#1E2620"></rect>
<rect x="90" y="120" width="144" height="324" rx="21" fill="#FBF6EE"></rect>
<text x="102" y="150" font-size="10" font-weight="700" fill="#1E2620" font-family="Fraunces, Georgia, serif">Rapid Fire</text>
<text x="102" y="176" font-size="12" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">Your ending used</text>
<text x="102" y="191" font-size="12" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">to rise. Now it falls.</text>
<rect x="100" y="204" width="124" height="96" rx="10" fill="#FFFFFF"></rect>
<path d="M108 252 C 130 250, 150 244, 168 248 S 200 240, 216 222" stroke="#8C978F" stroke-width="2" fill="none" stroke-dasharray="4 3"></path>
<path d="M108 250 C 130 246, 150 242, 168 246 S 200 262, 216 278" stroke="#2E5B3E" stroke-width="3" fill="none"></path>
<rect x="100" y="312" width="58" height="20" rx="10" fill="none" stroke="#1E2620" stroke-width="1"></rect>
<rect x="164" y="312" width="60" height="20" rx="10" fill="#2E5B3E"></rect>
<rect x="100" y="344" width="124" height="44" rx="8" fill="#FFFFFF"></rect>
<rect x="100" y="400" width="124" height="28" rx="14" fill="#2E5B3E"></rect>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">9 to 12 s</b><span style="font-size: 16px; line-height: 1.4">The lines settle into the app's pitch card, which shrinks into a phone showing the real screen.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="End card: VoiceLab. See how you sound." style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<rect x="28" y="150" width="58" height="58" rx="15" fill="#2E5B3E"></rect>
<path d="M38 182 C 47 182, 49 166, 57 166 C 65 166, 66 178, 76 174" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
<text x="28" y="270" font-size="48" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">VoiceLab.</text>
<text x="28" y="312" font-size="26" font-weight="600" fill="#2E5B3E" font-family="Fraunces, Georgia, serif">See how you sound.</text>
<rect x="28" y="340" width="176" height="40" rx="20" fill="#2E5B3E"></rect>
<text x="46" y="366" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Atkinson Hyperlegible Next, sans-serif">Join the waitlist</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">12 to 15 s</b><span style="font-size: 16px; line-height: 1.4">End card.</span></figcaption>
</figure>

</div>
</div>
</x-dc>

</body>
</html>
