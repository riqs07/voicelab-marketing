<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation as a rally</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5B3E}a:hover{color:#1F4029}
</style>
</helmet>
<div style="width: 1880px; height: 900px; box-sizing: border-box; padding: 44px 48px; background: #EFE8DC; color: #1E2620; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600">Conversation as a rally</h1>
<p style="margin: 0; font-size: 18px; color: #4A554D">The Talk share lines as a tennis rally seen from above. Each turn is a hit, held as long as the person talks; a question sends the ball back.</p>
</div>

<div style="display: flex; gap: 28px">

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="A court from above, Maya at the top, You at the bottom, the ball crossing the net" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<rect x="52" y="60" width="220" height="360" rx="6" fill="#E4EDE6" stroke="#2E5B3E" stroke-width="2"></rect>
<line x1="52" y1="240" x2="272" y2="240" stroke="#1E2620" stroke-width="3"></line>
<line x1="162" y1="60" x2="162" y2="420" stroke="#2E5B3E" stroke-width="1.5" opacity="0.4"></line>
<circle cx="162" cy="92" r="16" fill="#C9D0CA"></circle>
<text x="184" y="98" font-size="15" font-weight="700" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">Maya</text>
<circle cx="162" cy="388" r="16" fill="#2E5B3E"></circle>
<text x="184" y="394" font-size="15" font-weight="700" fill="#2E5B3E" font-family="Atkinson Hyperlegible Next, sans-serif">You</text>
<path d="M162 108 Q 210 200, 176 300" stroke="#F4A86E" stroke-width="2" fill="none" stroke-dasharray="4 5"></path>
<circle cx="176" cy="300" r="9" fill="#F4A86E"></circle>
<text x="24" y="468" font-size="13" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">Maya</text>
<rect x="70" y="456" width="30" height="16" rx="5" fill="#C9D0CA"></rect>
<text x="24" y="500" font-size="13" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">You</text>
<rect x="104" y="488" width="14" height="16" rx="5" fill="#2E5B3E"></rect>
<text x="24" y="540" font-size="14" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">“How was your weekend?”</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">0 to 3 s</b><span style="font-size: 16px; line-height: 1.4">Maya serves with her question. Every hit leaves a bar in the lane timeline below the court.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="The court tilts toward You as the ball keeps bouncing on your side; 77 percent you" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<g transform="rotate(-7 162 240)">
<rect x="52" y="60" width="220" height="360" rx="6" fill="#E4EDE6" stroke="#2E5B3E" stroke-width="2"></rect>
<line x1="52" y1="240" x2="272" y2="240" stroke="#1E2620" stroke-width="3"></line>
<circle cx="162" cy="92" r="16" fill="#C9D0CA"></circle>
<circle cx="162" cy="388" r="16" fill="#2E5B3E"></circle>
<path d="M110 360 Q 125 300, 140 350 Q 155 290, 170 345 Q 185 285, 200 352 Q 215 300, 226 360" stroke="#F4A86E" stroke-width="2" fill="none" stroke-dasharray="4 5"></path>
<circle cx="110" cy="360" r="5" fill="#F4A86E" opacity="0.3"></circle>
<circle cx="140" cy="350" r="6" fill="#F4A86E" opacity="0.45"></circle>
<circle cx="170" cy="345" r="7" fill="#F4A86E" opacity="0.65"></circle>
<circle cx="200" cy="352" r="8" fill="#F4A86E" opacity="0.8"></circle>
<circle cx="226" cy="360" r="9" fill="#F4A86E"></circle>
</g>
<text x="24" y="470" font-size="44" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">77%</text>
<text x="118" y="468" font-size="15" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">of the talking was you</text>
<text x="24" y="510" font-size="15" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">0 questions sent back</text>
<text x="24" y="548" font-size="14" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">“…then this café, then my cousin…”</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">3 to 7 s</b><span style="font-size: 16px; line-height: 1.4">You never send it back: the ball keeps bouncing on your side and the court tips toward you as your share climbs.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="Second try: the ball crosses back to Maya with an orange ring marking a question" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<rect x="52" y="60" width="220" height="360" rx="6" fill="#E4EDE6" stroke="#2E5B3E" stroke-width="2"></rect>
<line x1="52" y1="240" x2="272" y2="240" stroke="#1E2620" stroke-width="3"></line>
<circle cx="162" cy="92" r="16" fill="#C9D0CA"></circle>
<circle cx="162" cy="388" r="16" fill="#2E5B3E"></circle>
<path d="M162 108 Q 220 230, 168 372" stroke="#8C978F" stroke-width="1.5" fill="none" stroke-dasharray="4 5" opacity="0.6"></path>
<path d="M168 372 Q 100 260, 150 150" stroke="#F4A86E" stroke-width="2.5" fill="none" stroke-dasharray="4 5"></path>
<circle cx="150" cy="150" r="9" fill="#F4A86E"></circle>
<circle cx="150" cy="150" r="20" fill="none" stroke="#C26A2C" stroke-width="3"></circle>
<rect x="176" y="136" width="86" height="28" rx="14" fill="#FCE3CF"></rect>
<text x="188" y="155" font-size="14" font-weight="700" fill="#7A3A10" font-family="Atkinson Hyperlegible Next, sans-serif">question</text>
<text x="24" y="470" font-size="15" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">Second try</text>
<text x="24" y="508" font-size="14" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">“Good! I finally went hiking.</text>
<text x="24" y="528" font-size="14" fill="#1E2620" font-family="Atkinson Hyperlegible Next, sans-serif">What about you?”</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">7 to 11 s</b><span style="font-size: 16px; line-height: 1.4">Second try: a short answer, then a question. An orange ring marks the ball going back to Maya, and a real rally starts.</span></figcaption>
</figure>

<figure style="margin: 0; width: 324px; display: flex; flex-direction: column; gap: 12px">
<svg width="324" height="576" viewBox="0 0 324 576" role="img" aria-label="The court folds away into the lane timeline: 58 percent you, 2 questions sent back" style="border-radius: 22px; display: block">
<rect width="324" height="576" fill="#FBF6EE"></rect>
<rect x="52" y="60" width="220" height="140" rx="6" fill="#E4EDE6" stroke="#2E5B3E" stroke-width="2" opacity="0.25"></rect>
<text x="24" y="250" font-size="26" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">Who did the talking?</text>
<rect x="20" y="272" width="284" height="132" rx="18" fill="#FFFFFF"></rect>
<text x="36" y="314" font-size="14" font-weight="600" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">Maya</text>
<rect x="84" y="298" width="40" height="22" rx="7" fill="#C9D0CA"></rect>
<rect x="196" y="298" width="60" height="22" rx="7" fill="#C9D0CA"></rect>
<text x="36" y="356" font-size="14" font-weight="600" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">You</text>
<rect x="128" y="340" width="64" height="22" rx="7" fill="#2E5B3E"></rect>
<rect x="260" y="340" width="36" height="22" rx="7" fill="#2E5B3E"></rect>
<circle cx="184" cy="376" r="6" fill="#F4A86E"></circle>
<circle cx="288" cy="376" r="6" fill="#F4A86E"></circle>
<rect x="20" y="420" width="136" height="88" rx="16" fill="#FFFFFF"></rect>
<text x="36" y="466" font-size="36" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">58%</text>
<text x="36" y="492" font-size="13" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">of the talking was you</text>
<rect x="168" y="420" width="136" height="88" rx="16" fill="#FFFFFF"></rect>
<text x="184" y="466" font-size="36" font-weight="600" fill="#1E2620" font-family="Fraunces, Georgia, serif">2</text>
<text x="184" y="492" font-size="13" fill="#59645C" font-family="Atkinson Hyperlegible Next, sans-serif">questions sent back</text>
</svg>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><b style="font-size: 15px; color: #2E5B3E">11 to 15 s</b><span style="font-size: 16px; line-height: 1.4">The court folds flat into the app's real timeline chart, with the hits as bars and the questions as dots. Then the end card.</span></figcaption>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1880,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
